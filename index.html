<!doctype html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="hxLlflZbl5tbtN6YVCuYOKg2zf_aGsSZ0MGNYv9Vjwo" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <script>
      // Tablet scaling. The app is laid out as a ~632px column (600px max
      // content + padding), which looks small in the middle of an iPad.
      // On tablets we declare a 640px layout width instead, so the browser
      // natively scales the entire page to fill the screen, and re-scales
      // on rotation. Native viewport scaling keeps every coordinate
      // consistent (unlike CSS zoom/transform), so pinch-to-zoom in the
      // detail view and Practice's live width measurement are unaffected.
      //
      // iPadOS (desktop-class browsing) normally zooms a page OUT to fit its
      // content and then ignores a narrower declared width. "shrink-to-fit=no"
      // is what tells it to keep the 640px width we ask for.
      //
      // "Tablet" = short screen edge >= 700px AND either an iPad (iPadOS
      // reports itself as a Mac, so it is recognised by touch points) or touch
      // is the primary input. That excludes phones (short edge < 500px),
      // desktops, and touchscreen laptops (primary pointer is a mouse/trackpad).
      // maximum-scale is dropped for tablets so the page can also be
      // pinch-zoomed further.
      var rcTablet = false;
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var iPad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          var shortEdge = Math.min(screen.width, screen.height);
          if ((iPad || coarse) && shortEdge >= 700) {
            rcTablet = true;
            document.querySelector('meta[name="viewport"]')
              .setAttribute('content', 'width=640, shrink-to-fit=no');
          }
        } catch (e) { /* leave the default viewport in place */ }
      })();
      // Logs the layout width actually in use (visible in the browser console when debugging).
      window.addEventListener('load', function () {
        try { console.info('[layout] tablet scaling ' + (rcTablet ? 'on' : 'off') + ', layout width ' + window.innerWidth + 'px, screen ' + screen.width + 'x' + screen.height); } catch (e) { /* ignore */ }
      });
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Riff Catalog" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>Riff Catalog</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // Offline support: register the service worker (public/sw.js) so the
      // installed app can launch with no internet. Skipped on dev servers —
      // localhost and LAN IPs like 192.168.x.x from `npm run dev -- --host`
      // — so it can never cache development files or interfere with
      // hot reload.
      (function () {
        try {
          var h = location.hostname;
          var isDev = h === 'localhost' || h === '127.0.0.1' || /^\d+\.\d+\.\d+\.\d+$/.test(h);
          if (!isDev && 'serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js').catch(function (e) {
                console.warn('Service worker registration failed:', e);
              });
            });
          }
        } catch (e) { /* offline support is optional; never block startup */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
